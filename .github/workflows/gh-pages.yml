name: docs
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed by the git-revision-date-localized and
          # git-committers plugins.
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v3
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # The API reference is generated by importing the package, so the project
      # and its runtime dependencies must be installed, not just mkdocs.
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry config virtualenvs.create false
          poetry install --without dev
      # Documentation dependencies are intentionally not in pyproject.toml, so
      # that the lock file does not churn for documentation-only changes. This
      # list is the canonical copy.
      - name: Install docs dependencies
        run: |
          pip install mkdocs-material
          pip install "mkdocstrings[python]"
          pip install mkdocs-awesome-pages-plugin
          pip install mkdocs-nav-weight
          pip install mkdocs-git-revision-date-localized-plugin
          pip install mkdocs-git-committers-plugin-2
      - name: Deploy
        env:
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs gh-deploy --force
